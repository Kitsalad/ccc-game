name: Deploy API

on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        working-directory: api
        run: npm ci && npm test
      - name: Production packages only
        working-directory: api
        run: npm ci --omit=dev
      - uses: Azure/functions-action@v1
        with:
          app-name: ccc-game-api-6147
          package: api
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          sku: flexconsumption
